services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mediaflux-donation-backend:dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Mount aterm.jar from the host so we can swap versions without
      # rebuilding the image. Set ATERM_JAR_HOST_PATH in your .env to
      # point at where you downloaded aterm.jar locally (default below
      # matches the README's `~/.local/mflux/aterm.jar`). Only consulted
      # when MEDIAFLUX_CLIENT=aterm.
      - ${ATERM_JAR_HOST_PATH:-~/.local/mflux/aterm.jar}:/opt/mediaflux/aterm.jar:ro
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////app/data/donations.db"
      # Bundles land here inside the container. The path is on the
      # ./data:/app/data mount above, so the host sees them at
      # backend/data/donations/. The future Mediaflux sync script reads
      # bundles from the host side — it doesn't have to be in this
      # container.
      DONATIONS_STORAGE_DIR: "/app/data/donations"
